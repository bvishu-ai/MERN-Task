<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Task 8</title>
    <link rel="stylesheet" href="Task8styles.css" />
    <script defer src="Task8script.js"></script>
  </head>
  <body>
    <div class="container">
      <form id="registrationForm">
        <h1>Registration form</h1>

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" />
          <span id="firstNameError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" />
          <span id="lastNameError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
          <span id="emailError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" />
          <span id="passwordError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Re-enter Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" />
          <span id="confirmPasswordError" class="error">POOR OR MISMATCH</span>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <input type="radio" id="male" name="gender" value="Male" />
          <label for="male" class="radio-label">Male</label>
          <input type="radio" id="female" name="gender" value="Female" />
          <label for="female" class="radio-label">Female</label>
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="text" id="age" name="age" />
          <span id="ageError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="phoneNumber">Phone Number</label>
          <input type="text" id="phoneNumber" name="phoneNumber" />
          <span id="phoneNumberError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address"></textarea>
          <span id="addressError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="state">State</label>
          <input type="text" id="state" name="state" />
          <span id="stateError" class="error">POOR</span>
        </div>

        <div class="form-group">
          <label for="country">Country</label>
          <select id="country" name="country">
            <option value="">Choose your country</option>
            <option value="">India</option>
            <option value="">USA</option>
          </select>
        </div>

        <div class="form-group">
          <label>Languages known</label>
          <input
            type="checkbox"
            id="english"
            name="languages"
            value="English"
          />
          <label for="english" class="checkbox-label">English</label>
          <input
            type="checkbox"
            id="kannada"
            name="languages"
            value="Kannada"
          />
          <label for="kannada" class="checkbox-label">Kannada</label>
          <input type="checkbox" id="hindi" name="languages" value="Hindi" />
          <label for="hindi" class="checkbox-label">Hindi</label>
          <input type="checkbox" id="telugu" name="languages" value="Telugu" />
          <label for="telugu" class="checkbox-label">Telugu</label>
        </div>

        <div class="form-group">
          <input type="checkbox" id="declaration" name="declaration" />
          <label for="declaration"
            >Hereby I declare all the given details are true</label
          >
        </div>

        <button type="submit">REGISTER</button>
      </form>
    </div>
  </body>
</html>
